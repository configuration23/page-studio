slug: contact
title: Проверка формы
lead: "Вторая страница портала — не про картинки. Тот же контракт: поля, кнопка,
  статус, и всё это обвязывается тем же демо-драйвером."
canvas:
  width: 960
elements:
  - id: heading
    kind: label
    x: 120
    y: 40
    w: 600
    h: 48
    props:
      text: Напишите нам
      size: xl
  - id: name
    kind: edit
    x: 40
    y: 104
    w: 420
    h: 64
    label: Имя
    props:
      placeholder: Как к вам обращаться
      max: 120
  - id: topic
    kind: combo
    x: 480
    y: 104
    w: 300
    h: 64
    label: Тема
    props:
      options:
        - Вопрос
        - Идея
        - Ошибка
  - id: message
    kind: memo
    x: 40
    y: 186
    w: 740
    h: 140
    label: Сообщение
    props:
      placeholder: Свободный текст, до 800 символов
      max: 800
  - id: agree
    kind: check
    x: 40
    y: 376
    w: 420
    h: 32
    label: Понимаю, что это тестовая форма
  - id: send
    kind: button
    x: 40
    y: 440
    w: 220
    h: 48
    label: Отправить
    props:
      primary: true
  - id: trace
    kind: list
    x: 480
    y: 336
    w: 380
    h: 100
    label: Журнал обработки
    props:
      empty: Пока ничего не отправляли
  - id: status
    kind: status
    x: 296
    y: 456
    w: 300
    h: 32
